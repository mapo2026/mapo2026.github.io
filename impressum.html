<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Polheim Systems | Fahrzeugeinrichtungen & Dachträger</title>
    <style>
        :root {
            --primary: #0a2540; /* Modernes Dunkelblau */
            --accent: #ff6b00;  /* Signal-Orange für Akzente */
            --light: #f4f6f8;   /* Heller Hintergrund */
            --text: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { color: var(--text); line-height: 1.6; }
        header { background: var(--primary); color: white; padding: 20px; sticky; top: 0; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; font-size: 24px; color: white; text-decoration: none; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; }
        nav a:hover { color: var(--accent); }
        .hero { background: linear-gradient(rgba(10,37,64,0.85), rgba(10,37,64,0.85)), url('https://unsplash.com') center/cover; color: white; padding: 100px 20px; text-align: center; }
        .hero h1 { font-size: 42px; margin-bottom: 20px; }
        .hero p { font-size: 20px; max-width: 800px; margin: 0 auto 30px; }
        .btn { background: var(--accent); color: white; padding: 12px 28px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block; transition: background 0.3s; }
        .btn:hover { background: #e05e00; }
        .container { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
        .section-title { text-align: center; font-size: 32px; margin-bottom: 40px; color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { background: var(--light); padding: 30px; border-radius: 6px; border-top: 4px solid var(--primary); }
        .card h3 { margin-bottom: 15px; color: var(--primary); }
        .card ul { list-style-type: none; }
        .card ul li { margin-bottom: 8px; padding-left: 15px; position: relative; }
        .card ul li::before { content: "•"; color: var(--accent); font-weight: bold; position: absolute; left: 0; }
        .contact-box { background: var(--primary); color: white; padding: 40px; border-radius: 6px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: none; border-radius: 4px; }
        footer { background: #051422; color: #999; text-align: center; padding: 30px 20px; font-size: 14px; }
    

header {
    display: flex;
    justify-content: space-between; /* Schiebt Logo-Einheit nach links und Nav nach rechts */
    align-items: center;
    background-color: #051d3b; /* Dunkelblau aus Ihrem Design */
    height: 80px; 
    padding: 0 40px;
}

.logo-link {
    display: flex;
    align-items: center;
    gap: 15px; /* Abstand zwischen dem Bild-Logo und dem Text "POLHEIM SYSTEMS" */
    text-decoration: none; /* Entfernt den Unterstrich beim Text */
    height: 100%;
}

.logo-img {
    max-height: 70%; /* Passt die Bildgröße perfekt an die Zeilenhöhe an */
    width: auto;
    object-fit: contain;
    display: block;
}

.logo-text {
    color: #ffffff;
    font-weight: bold;
    font-size: 22px;
    white-space: nowrap; /* Verhindert einen ungewollten Zeilenumbruch beim Namen */
}

/* Styling für die Navigation auf der rechten Seite */
nav {
    display: flex;
    gap: 25px;
}

nav a {
    color: #ffffff;
    text-decoration: none;
    font-weight: 500;
}

nav a:hover {
    text-decoration: underline; /* Kleiner visueller Effekt beim Drüberfahren */
}


</style>
</head>
